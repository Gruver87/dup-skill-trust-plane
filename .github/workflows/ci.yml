name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install self
        run: pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Unit tests (no sibling gates required for card/sandbox)
        run: python -m pytest tests/test_card.py tests/test_sandbox.py -q
      - name: Status
        run: python -m skill_trust status
